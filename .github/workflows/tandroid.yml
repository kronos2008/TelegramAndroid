name: Build ForkClient

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: nttld/setup-ndk@v1.4.2
        with:
          ndk-version: r21e
          link-to-sdk: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore

      - name: Build
        run: |
          echo "APP_ID=${{ secrets.APP_ID }}" >> gradle.properties
          echo "APP_HASH=${{ secrets.APP_HASH }}" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.ALIAS_PASS }}" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.ALIAS_NAME }}" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASS }}" >> gradle.properties
          echo "ADDITIONAL_BUILD_NUMBER=1" >> gradle.properties
          sudo apt update
          sudo apt -y install ninja-build meson gperf cmake python3 python3-pip
          ./gradlew :TMessagesProj_App:assembleAfatRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ForkClient-release
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
